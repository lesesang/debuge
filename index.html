<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dice Random Tester</title>
<style>:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;min-height:100vh;background:#111827;color:#f3f4f6}main{max-width:820px;margin:0 auto;padding:32px 20px 48px}h1{margin:0 0 8px}.muted,.hint{color:#9ca3af}.card{background:#1f2937;border:1px solid #374151;border-radius:14px;padding:20px;margin-top:20px}label{display:block;margin:14px 0 6px;font-weight:700}input,textarea{box-sizing:border-box;width:100%;background:#111827;color:#f3f4f6;border:1px solid #4b5563;border-radius:8px;padding:10px 12px;font:inherit}textarea{min-height:88px;resize:vertical}button{margin-top:16px;padding:10px 14px;border:0;border-radius:8px;cursor:pointer;font-weight:700}#generate{background:#f3f4f6;color:#111827}#copy{background:#374151;color:#fff;margin-left:8px}.row{display:flex;gap:8px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:8px;font-weight:400}.check input{width:auto}.error{color:#fca5a5;min-height:1.4em}pre{white-space:pre-wrap;overflow:auto;background:#0b1020;border:1px solid #374151;border-radius:8px;padding:14px;line-height:1.5}.small{font-size:.9rem}</style></head>
<body><main><h1>Dice Random Tester</h1><p class="muted">다이스 결과를 지정해 <code>submitComment()</code> 테스트 코드를 만듭니다.</p>
<section class="card">
<label for="tests">테스트 항목</label><textarea id="tests" placeholder="예: 2d100u = 40,80; 1d600 = 123"></textarea>
<p class="hint">여러 항목은 <b>;</b>로 구분하고, 각 다이스의 결과는 <b>,</b>로 구분합니다. 지원 형식: <code>NdM</code>, <code>NdMmK</code>, 끝에 <code>u</code>/<code>s</code>. 예: <code>2d100u = 40,80; 3d20m5 = 7,12,20</code></p>
<div class="row"><label class="check"><input id="preserve" type="checkbox" checked> sjcl 암호화용 Math.random은 원래 난수 사용</label></div>
<div id="error" class="error"></div><button id="generate">코드 생성</button><button id="copy" type="button">복사</button>
<label for="output">생성된 코드</label><pre id="output">여기에 테스트 코드가 표시됩니다.</pre></section>
<section class="card small"><b>중요:</b> 다이스 계산에 사용되는 <code>Math.random()</code>만 지정한 값으로 바꾸고, <code>sjcl.js</code>의 암호화용 난수는 기본적으로 원래 난수를 사용합니다.</section>
</main>
<script>
const testsEl=document.querySelector('#tests'),outputEl=document.querySelector('#output'),errorEl=document.querySelector('#error'),preserveEl=document.querySelector('#preserve');
function diceSpec(token){const m=token.trim().match(/^(\d+)d(\d+)(?:m(\d+))?([su]{0,2})$/);if(!m)throw new Error(`다이스 형식이 올바르지 않습니다: ${token}`);const count=+m[1],max=+m[2],min=m[3]===undefined?1:+m[3],flags=m[4]||'';if(count<1||count>50)throw new Error(`${token}: 주사위 개수는 1~50입니다.`);if(max<1||max>10000||min<0||min>9999||min>max)throw new Error(`${token}: 최소/최대값을 확인하세요.`);if(flags.includes('u')&&count>max-min+1)throw new Error(`${token}: u에서는 ${count}개를 중복 없이 뽑을 수 없습니다.`);return{count,max,min,unique:flags.includes('u')}}
function toRandom(value,min,max){if(!Number.isInteger(value)||value<min||value>max)throw new Error(`${min}~${max} 범위 밖의 결과: ${value}`);return(value-min+0.5)/(max-min+1)}
function uniqueToRandom(results,min,max){const rem=[];for(let n=min;n<=max;n++)rem.push(n);return results.map(v=>{if(!Number.isInteger(v)||v<min||v>max)throw new Error(`${min}~${max} 범위 밖의 결과: ${v}`);const i=rem.indexOf(v);if(i<0)throw new Error(`u 결과가 중복되었습니다: ${v}`);const r=(i+0.5)/rem.length;rem.splice(i,1);return r})}
function parseInput(){const raw=testsEl.value.trim();if(!raw)throw new Error('테스트 항목을 입력하세요.');const groups=raw.split(/\s*;\s*/).map(x=>x.trim()).filter(Boolean);const values=[];for(const group of groups){const p=group.split(/\s*=\s*/);if(p.length!==2)throw new Error(`= 기준으로 형식이 올바르지 않습니다: ${group}`);const token=p[0].trim(),results=p[1].split(/\s*,\s*/).filter(Boolean).map(Number),spec=diceSpec(token);if(results.length!==spec.count)throw new Error(`${token}: 결과 ${spec.count}개가 필요하지만 ${results.length}개입니다.`);values.push(...(spec.unique?uniqueToRandom(results,spec.min,spec.max):results.map(v=>toRandom(v,spec.min,spec.max))))}return values}
function generate(){errorEl.textContent='';try{const values=parseInput(),nums=values.map(v=>Number(v.toFixed(12))),preserve=preserveEl.checked;outputEl.textContent=`(()=>{\n  if(window.__diceTestRestore) window.__diceTestRestore();\n  if(!window.__diceNativeRandom) window.__diceNativeRandom=Math.random;\n  window.__diceTestValues=[${nums.join(', ')}];\n  window.__diceIndex=0;\n  window.__diceTestRestore=()=>{Math.random=window.__diceNativeRandom;delete window.__diceTestValues;delete window.__diceIndex;};\n  Math.random=function(){\n    const stack=new Error().stack||'';\n    ${preserve?"if(stack.includes('sjcl.js')) return window.__diceNativeRandom();":""}\n    if(stack.includes('submitComment') && window.__diceIndex<window.__diceTestValues.length){\n      return window.__diceTestValues[window.__diceIndex++];\n    }\n    return window.__diceNativeRandom();\n  };\n})();`;}catch(e){outputEl.textContent='여기에 테스트 코드가 표시됩니다.';errorEl.textContent=e.message}}
document.querySelector('#generate').addEventListener('click',generate);document.querySelector('#copy').addEventListener('click',async()=>{const text=outputEl.textContent;if(!text||text.startsWith('여기에'))return;try{await navigator.clipboard.writeText(text);errorEl.textContent='복사했습니다.'}catch{errorEl.textContent='자동 복사에 실패했습니다. 코드를 직접 복사하세요.'}});generate();
</script></body></html>
